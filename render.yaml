services:
  - type: web
    name: raze
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MODE
        value: protected
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: raze-postgres
          property: connectionString

databases:
  - name: raze-postgres
    plan: free
