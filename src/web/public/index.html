<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raze</title>
<style>
  :root{
    --ground:#0a0f0d; --panel:#101614; --panel2:#0d1311; --line:#1e2a26;
    --ink:#dfe7e3; --muted:#7d8f89; --dim:#54635e;
    --risk:#e0a458; --bad:#e05c4a; --good:#5fbf8f; --cool:#6aa9c9;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
    font-size:14.5px;line-height:1.6;display:flex;flex-direction:column}
  code{font-family:var(--mono);font-size:.92em;background:var(--panel2);
    border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  strong{font-weight:650}

  header{flex:none;border-bottom:1px solid var(--line);padding:13px 22px;
    display:flex;gap:14px;align-items:center}
  .brand{font-weight:650;letter-spacing:-.01em;font-size:15px}
  .spacer{flex:1}
  .pill{font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:4px 11px;
    border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .pill.good{color:var(--good);border-color:#1e3a2e;background:#0d1a14}
  .pill.bad{color:var(--bad);border-color:#4a2420;background:#1c0f0d}
  .pill.warn{color:var(--risk);border-color:#4a3a20;background:#1c150d}

  main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
  .stream{flex:1;width:100%;max-width:780px;overflow-y:auto;padding:26px 22px 8px;
    display:flex;flex-direction:column;gap:20px}

  .turn{display:flex;flex-direction:column;gap:8px}
  .turn.you{align-items:flex-end}
  .who{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .said{max-width:68ch}
  .turn.you .said{background:#16211d;border:1px solid #24332d;border-radius:12px;
    padding:9px 13px;max-width:80%}
  .said p{margin:0 0 10px} .said p:last-child{margin-bottom:0}
  .said ul{margin:8px 0;padding-left:20px}
  .dots::after{content:'…';animation:blink 1.2s infinite}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

  /* a card is one thing to do, inline in the conversation */
  .card{border:1px solid var(--line);border-radius:11px;background:var(--panel);
    padding:15px 16px;max-width:68ch}
  .card.done{border-color:#1e3a2e;background:#0d1a14}
  .card .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;
    margin-bottom:4px}
  .field{margin-bottom:11px}
  .field:last-of-type{margin-bottom:13px}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:10px 12px;font-family:var(--sans);font-size:14px}
  input:focus,select:focus{outline:2px solid #24413a;outline-offset:-1px}
  select{font-family:var(--mono);font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  button{font-family:inherit;font-size:14px;background:#16211d;border:1px solid #24332d;
    color:var(--ink);border-radius:8px;padding:10px 16px;cursor:pointer}
  button:hover{background:#1b2a24}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:#1d3a30;border-color:#2b5546}
  button.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
  .actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .note{font-size:12px;color:var(--dim);margin-top:11px;line-height:1.55}
  .err{color:var(--bad);font-size:13px;margin-top:10px}
  .ok{color:var(--good)}

  .map{font-family:var(--mono);font-size:12.5px;color:var(--muted);
    border-left:2px solid #2b5546;padding-left:11px;margin:11px 0}
  .map b{color:var(--ink);font-weight:500}

  .figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:4px}
  .fig{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--panel2)}
  .fig .k{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  .fig .v{font-family:var(--mono);font-size:20px;margin-top:2px}
  .fig.good .v{color:var(--good)} .fig.risk .v{color:var(--risk)}

  pre{margin:11px 0 0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:12px;overflow-x:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);
    max-height:280px;line-height:1.5}

  .composer{flex:none;width:100%;max-width:780px;padding:10px 22px 18px}
  .cbox{display:flex;gap:9px;align-items:center;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:7px 8px 7px 14px}
  .cbox input{border:none;background:transparent;padding:6px 0}
  .cbox input:focus{outline:none}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    border-radius:99px;padding:5px 12px;font-size:12.5px;cursor:pointer}
  .chip:hover{color:var(--ink);border-color:#2b5546}
  .disclaim{font-size:11.5px;color:var(--dim);margin-top:9px;text-align:center}
  .hide{display:none !important}
</style>
</head>
<body>

<header>
  <div class="brand">Raze</div>
  <div class="spacer"></div>
  <div class="pill" id="pill">…</div>
</header>

<main>
  <div class="stream" id="stream"></div>
  <div class="composer">
    <div class="cbox">
      <input id="ask" placeholder="Ask about your payments…" autocomplete="off">
      <button class="primary" id="send">Send</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="disclaim">Raze reads your database and Razorpay directly. The states and
      amounts are not generated by a model.</div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rupees = (p) => '₹' + (Math.round(Number(p)||0)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const post = async (u,b) => (await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})})).json();
const get  = async (u) => (await fetch(u)).json();

function md(t){
  return esc(t).split(/\n{2,}/).map(b=>{
    const lines=b.split('\n');
    if(lines.every(l=>/^\s*[-*]\s+/.test(l)))
      return '<ul>'+lines.map(l=>'<li>'+inline(l.replace(/^\s*[-*]\s+/,''))+'</li>').join('')+'</ul>';
    return '<p>'+lines.map(inline).join('<br>')+'</p>';
  }).join('');
}
const inline = (s) => s
  .replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
  .replace(/\b(order_[A-Za-z0-9]+)\b/g,'<code>$1</code>');

function turn(who, html, cls){
  const el=document.createElement('div');
  el.className='turn '+(cls||who.toLowerCase());
  el.innerHTML='<div class="who">'+esc(who)+'</div><div class="said">'+html+'</div>';
  $('stream').appendChild(el);
  el.scrollIntoView({behavior:'smooth',block:'end'});
  return el;
}
const card = (html) => { const el=turn('Raze','<div class="card">'+html+'</div>'); return el.querySelector('.card'); };

// ---- the setup conversation ------------------------------------------------
let picked = {};

async function advance(){
  const {step,state} = await get('/api/ray/next');
  if(step.id==='done'){ await running(state); return; }
  if(step.say) turn('Raze', md(step.say));

  if(step.id==='mapping') return mappingCard(step);
  if(step.fields)  return fieldsCard(step);
  if(step.choices) return choicesCard(step);
  if(step.action)  return actionCard(step);
}

function fieldsCard(step){
  const c=card(
    step.fields.map(f=>'<div class="field"><div class="lbl">'+esc(f.label)+'</div>'
      + '<input id="f_'+f.name+'" type="'+(f.type||'text')+'" placeholder="'+esc(f.placeholder||'')+'"></div>').join('')
    + '<div class="actions"><button class="primary" id="go">'+esc(step.action)+'</button></div>'
    + (step.note?'<div class="note">'+esc(step.note)+'</div>':'')
    + '<div id="e"></div>');
  c.querySelector('#go').onclick = async (e)=>{
    e.target.disabled=true; e.target.textContent='Checking…';
    const values={}; step.fields.forEach(f=>values[f.name]=c.querySelector('#f_'+f.name).value);
    const d=await post('/api/ray/act',{step:step.id,values});
    if(d.error){ c.querySelector('#e').innerHTML='<div class="err">'+esc(d.error)+'</div>';
      e.target.disabled=false; e.target.textContent=step.action; return; }
    settle(c,d); advance();
  };
}

function choicesCard(step){
  const c=card('<div class="actions">'
    + step.choices.map(ch=>'<button data-v="'+esc(ch.value)+'">'+esc(ch.label)+'</button>').join('')
    + '</div>' + (step.note?'<div class="note">'+esc(step.note)+'</div>':''));
  c.querySelectorAll('[data-v]').forEach(b=>{
    b.onclick=async()=>{
      c.querySelectorAll('button').forEach(x=>x.disabled=true);
      const d=await post('/api/ray/act',{step:step.id,values:{choice:b.dataset.v}});
      settle(c,d); advance();
    };
  });
}

function actionCard(step){
  const c=card('<div class="actions"><button class="primary" id="go">'+esc(step.action)+'</button></div>'
    + (step.note?'<div class="note">'+esc(step.note)+'</div>':'')+'<div id="e"></div>');
  c.querySelector('#go').onclick=async(e)=>{
    e.target.disabled=true; e.target.textContent='Working…';
    const d=await post('/api/ray/act',{step:step.id,values:{}});
    if(d.error){ c.querySelector('#e').innerHTML='<div class="err">'+esc(d.error)+'</div>';
      e.target.disabled=false; e.target.textContent=step.action; return; }
    settle(c,d);
    if(d.backfill) backfillCard(d.backfill);
    advance();
  };
}

// The mapping: either what Raze found, or — when it could not tell — what the
// merchant states, checked against their live schema before anything is armed.
function mappingCard(step){
  if(step.mapping){
    const m=step.mapping;
    const c=card(
      '<div class="map">match on <b>'+esc(m.table)+'.'+esc(m.key)+'</b> ← the Razorpay order id<br>'
      + Object.keys(m.set||{}).map(k=>'set <b>'+esc(k)+'</b> = paid').join('<br>')
      + (Object.keys(m.add||{}).length?'<br>'+Object.keys(m.add).map(k=>'add the amount to <b>'+esc(k)+'</b>').join('<br>'):'')
      + (m.guard?'<br>refuse if <b>'+esc(m.guard.column)+'</b> is already refunded':'')
      + '</div>'
      + '<div class="actions"><button class="primary" id="yes">'+esc(step.action)+'</button>'
      + '<button class="ghost" id="no">'+esc(step.alt)+'</button></div>'
      + (step.note?'<div class="note">'+esc(step.note)+'</div>':'')+'<div id="e"></div>');
    c.querySelector('#yes').onclick=()=>askAmount(c,m.table,{key:m.key,
      status:Object.keys(m.set||{})[0], credited:Object.keys(m.add||{})[0]});
    c.querySelector('#no').onclick=()=>{ c.innerHTML=''; statePicker(c,[m.table]); };
    return;
  }
  const c=card('<div id="pick"></div>');
  statePicker(c.querySelector('#pick'), step.pick.tables);
}

async function statePicker(host, tables){
  host.innerHTML =
    '<div class="field"><div class="lbl">Which table holds your orders?</div>'
    + '<select id="mTable">'+tables.map(t=>'<option>'+esc(t)+'</option>').join('')+'</select></div>'
    + '<div class="grid2"><div class="field"><div class="lbl">Razorpay order id</div><select id="mKey"></select></div>'
    + '<div class="field"><div class="lbl">Paid / unpaid status</div><select id="mStatus"></select></div></div>'
    + '<div class="field"><div class="lbl">Money is credited to</div><select id="mCred"></select></div>'
    + '<div class="actions"><button class="primary" id="chk">Check these against my database</button></div>'
    + '<div class="note">Every name is checked against your live schema before anything is armed.</div>'
    + '<div id="e"></div>';
  const load = async () => {
    const d=await post('/api/ray/act',{step:'columns',values:{table:host.querySelector('#mTable').value}});
    const opt=(l)=>l.map(c=>'<option>'+esc(c)+'</option>').join('');
    host.querySelector('#mKey').innerHTML=opt(d.columns);
    host.querySelector('#mStatus').innerHTML=opt(d.columns);
    host.querySelector('#mCred').innerHTML=opt(d.numeric);
  };
  host.querySelector('#mTable').onchange=load;
  await load();
  host.querySelector('#chk').onclick=()=>{
    askAmount(host, host.querySelector('#mTable').value, {
      key: host.querySelector('#mKey').value,
      status: host.querySelector('#mStatus').value,
      credited: host.querySelector('#mCred').value,
    });
  };
}

// Asked, never inferred: two number columns look identical from outside, and
// writing to the one a payment is checked against destroys the check.
async function askAmount(host, table, chosen){
  const cols=await post('/api/ray/act',{step:'columns',values:{table}});
  const options=cols.numeric.filter(c=>c!==chosen.credited);
  turn('Raze', md("Last thing. Which column says what an order **should** cost — as distinct "
    + "from what has been credited so far?"));
  const c=card(
    '<div class="actions">'
    + options.map(o=>'<button data-a="'+esc(o)+'"><code>'+esc(o)+'</code></button>').join('')
    + '<button class="ghost" data-a="__none__">There is no such column</button></div>'
    + '<div class="note">I will not guess this. Without it I can still tell you when Razorpay '
    + 'and your database disagree, but I will not repair anything on my own — there would be '
    + 'nothing to check a payment against.</div><div id="e"></div>');
  c.querySelectorAll('[data-a]').forEach(b=>{
    b.onclick=async()=>{
      c.querySelectorAll('button').forEach(x=>x.disabled=true);
      const expected=b.dataset.a==='__none__'?null:b.dataset.a;
      const d=await post('/api/ray/act',{step:'mapping',values:{table,...chosen,expected}});
      if(d.error){ c.querySelector('#e').innerHTML='<div class="err">'+esc(d.error)+'</div>';
        c.querySelectorAll('button').forEach(x=>x.disabled=false); return; }
      settle(c,d);
      if(d.integration) integrationCard(d.integration);
      advance();
    };
  });
}

function settle(c,d){
  c.classList.add('done');
  c.innerHTML='<div class="ok">✓ '+esc(d.confirm||'Done')+'</div>'
    + (d.detail?'<div class="note">'+esc(d.detail)+'</div>':'');
}

function integrationCard(code){
  turn('Raze', md("I've written your integration out as code you own. You don't have to run "
    + "it — I apply the same mapping myself — but this is exactly what has been installed on "
    + "your behalf, in your stack's terms."));
  card('<pre>'+esc(code)+'</pre>');
}

function backfillCard(b){
  turn('Raze', md(b.missing
    ? "Here's where you actually stand."
    : "Nothing is missing. Every settled payment at Razorpay is in your database."));
  card('<div class="figs">'
    + '<div class="fig"><div class="k">Settled at Razorpay</div><div class="v">'+b.checked+'</div></div>'
    + '<div class="fig '+(b.missing?'risk':'good')+'"><div class="k">Not in your database</div>'
    + '<div class="v">'+b.missing+'</div></div>'
    + (b.missing?'<div class="fig risk"><div class="k">At risk</div><div class="v">'+rupees(b.paise)+'</div></div>':'')
    + '</div>');
}

// ---- once setup is done ----------------------------------------------------
async function running(state){
  const a=await get('/api/activity?hours=24');
  const rec=a.recovered||{count:0,paise:0}, wait=a.waiting||{count:0,paise:0,orders:[]};
  turn('Raze', md("I'm watching your payments now — checking against Razorpay every minute, "
    + "and noticing when an order is created but the payment never arrives."));
  card('<div class="figs">'
    + '<div class="fig '+(rec.count?'good':'')+'"><div class="k">Recovered</div><div class="v">'+rupees(rec.paise)+'</div></div>'
    + '<div class="fig '+(wait.count?'risk':'')+'"><div class="k">Waiting for you</div><div class="v">'+wait.count+'</div></div>'
    + '</div>'
    + (wait.orders||[]).slice(0,4).map(o=>'<div class="note"><code>'+esc(o.order_id)+'</code> '
      + rupees(o.amount_paise)+' — '+esc(o.why)+'</div>').join(''));
  $('chips').innerHTML=['is everything alright?','what are we missing?','what have you done today?']
    .map(q=>'<button class="chip">'+esc(q)+'</button>').join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>ask(b.textContent));
}

// ---- free conversation -----------------------------------------------------
async function ask(q){
  if(!q.trim()) return;
  turn('You', esc(q));
  $('ask').value='';
  const t=turn('Raze','<span class="dots">thinking</span>');
  $('send').disabled=true;
  try{
    const d=await post('/api/agent/ask',{question:q});
    t.querySelector('.said').innerHTML=md(d.text||'No answer came back.');
    refreshPill();
  }catch(err){ t.querySelector('.said').textContent='I could not answer: '+err.message; }
  finally{ $('send').disabled=false; }
}
$('send').onclick=()=>ask($('ask').value);
$('ask').onkeydown=(e)=>{ if(e.key==='Enter') ask($('ask').value); };

const TONE={PROTECTED:'good',DIVERGED:'bad',STALE:'warn',UNARMED:'warn',BLIND:'warn',
  DISCONNECTED:'warn',MISMATCHED:'warn'};
async function refreshPill(){
  try{
    const s=await get('/api/agent/state');
    $('pill').textContent=s.state||'…';
    $('pill').className='pill '+(TONE[s.state]||'');
    $('pill').title=s.says||'';
  }catch{}
}

refreshPill();
setInterval(refreshPill, 45000);
advance();
</script>
</body>
</html>
