# Judge-runnable demo mode.
#
#   docker compose up -d
#   npm install && npx raze demo --sever-delivery
#
# Postgres only. The demo merchant and raze run on the host so their output is
# visible in the terminal rather than buried in container logs.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raze
      POSTGRES_PASSWORD: raze
      POSTGRES_DB: raze
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raze"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - raze_pgdata:/var/lib/postgresql/data

volumes:
  raze_pgdata:
